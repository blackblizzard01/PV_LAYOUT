[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pv-layout-design"
version = "0.1.0"
description = "PV site geometric and electrical design tool"
requires-python = ">=3.11"
dependencies = [
    "pvlib>=0.10",
    "numpy>=1.26",
    "scikit-learn>=1.4",
    "matplotlib>=3.8",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov"]

[tool.setuptools.packages.find]
where = ["."]
include = ["pv_layout*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
