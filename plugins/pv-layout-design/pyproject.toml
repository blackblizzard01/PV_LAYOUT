[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pv-layout-design"
version = "0.2.0"
description = "PV site geometric and electrical design tool (Layer 1 base + Layer 2/3 improvements)"
requires-python = ">=3.11"
dependencies = [
    "pvlib>=0.10",
    "numpy>=1.26",
    "scikit-learn>=1.4",
    "matplotlib>=3.8",
    "shapely>=2.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov"]

[tool.setuptools.packages.find]
where = ["."]
include = ["pv_layout*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
